{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "acm-member-portal.secretName" . }}
  labels:
    {{- include "acm-member-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.secret.betterAuthSecret | quote }}
  MICROSOFT_CLIENT_ID: {{ .Values.secret.microsoftClientId | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.secret.microsoftClientSecret | quote }}
  MICROSOFT_TENANT_ID: {{ .Values.secret.microsoftTenantId | quote }}
  SMTP_HOST: {{ .Values.secret.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secret.smtpPort | quote }}
  SMTP_USER: {{ .Values.secret.smtpUser | quote }}
  SMTP_PASS: {{ .Values.secret.smtpPass | quote }}
  SMTP_FROM: {{ .Values.secret.smtpFrom | quote }}
  WINDOWS_API_URL: {{ .Values.secret.windowsApiUrl | quote }}
  WINDOWS_API_TOKEN: {{ .Values.secret.windowsApiToken | quote }}
{{- end }}
