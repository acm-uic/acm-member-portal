apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "acm-member-portal.fullname" . }}-test-connection"
  labels:
    helm.sh/chart: {{ include "acm-member-portal.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args:
        - -qO-
        - http://{{ include "acm-member-portal.fullname" . }}:{{ .Values.service.port }}/healthz
