{{- include "acm-member-portal.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acm-member-portal.fullname" . }}
  labels:
    {{- include "acm-member-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    app: {{ include "acm-member-portal.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "acm-member-portal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      {{- if or .Values.secret.create (eq (include "acm-member-portal.createDatabaseSecret" .) "true") .Values.podAnnotations }}
      annotations:
        {{- if or .Values.secret.create (eq (include "acm-member-portal.createDatabaseSecret" .) "true") }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/database-secret: {{ include (print $.Template.BasePath "/secret-database.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "acm-member-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
        app: {{ include "acm-member-portal.fullname" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "acm-member-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "scripts/migrate.ts"]
          env:
            {{- include "acm-member-portal.databaseUrlEnv" . | nindent 12 }}
          {{- include "acm-member-portal.envFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      containers:
        - name: portal
          image: {{ include "acm-member-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: ORIGIN
              value: {{ include "acm-member-portal.origin" . | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: BETTER_AUTH_URL
              value: {{ include "acm-member-portal.origin" . | quote }}
            {{- include "acm-member-portal.databaseUrlEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "acm-member-portal.envFrom" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
