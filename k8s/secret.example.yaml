# Template only — never commit real values. Apply via Terraform
# (kubernetes_secret resource in app-registration.tf) or external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: portal-secrets
  namespace: acm-portal
type: Opaque
stringData:
  DATABASE_URL: "postgres://portal:<password>@portal-db-rw:5432/portal"
  BETTER_AUTH_SECRET: "<openssl rand -base64 32>"
  MICROSOFT_CLIENT_ID: "<from terraform output>"
  MICROSOFT_CLIENT_SECRET: "<from terraform output>"
  MICROSOFT_TENANT_ID: "<tenant guid>"
  DISCORD_CLIENT_ID: "<discord application client id>"
  DISCORD_CLIENT_SECRET: "<discord application client secret>"
  DISCORD_GUILD_ID: "<acm@uic discord server snowflake>"
  SMTP_HOST: "<smtp relay host>"
  SMTP_PORT: "587"
  SMTP_USER: "<smtp user>"
  SMTP_PASS: "<smtp password>"
  SMTP_FROM: "ACM@UIC <portal@acm-uic.org>"
  WINDOWS_API_URL: "https://ad-api.acm.local"
  WINDOWS_API_TOKEN: "<shared bearer with windows-api>"
